apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: v-1-3
  name: read-random-wiki-page
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: todo-cronjob
            image: centos
            command: ["/script/cronjob-script.sh"]
            volumeMounts:
              - name: script
                mountPath: "/script"
            env:
            - name: BACKEND_HOST
              valueFrom:
                configMapKeyRef:
                  name: todo-app-cfgmap
                  key: backend_host
          volumes:
            - name: script
              configMap:
                name: cronjob-configmap
                defaultMode: 0500
          restartPolicy: Never

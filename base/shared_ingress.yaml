apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-shared-ingress
spec:                             
  rules:
  - http:
      paths:
      - path: /todos
        pathType: Prefix
        backend:
          service:
            name: todo-backend-service
            port:
              number: 80
      - path: /healthz
        pathType: Prefix
        backend:
          service:
            name: todo-backend-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: todo-app-service
            port:
              number: 80